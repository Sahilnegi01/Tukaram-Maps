services:
  - type: web
    name: tukaram-maps-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: alembic upgrade head && python -m app.infrastructure.database.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tukaram-maps-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://tukaram-maps.vercel.app
      - key: CORS_ORIGINS
        value: https://tukaram-maps.vercel.app
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: tukaram-maps-db
    plan: free
    databaseName: enforcement
    user: enforcement
